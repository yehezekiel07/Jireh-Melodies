<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jireh Melodies</title>
    <link href="style.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>
  <body>
    <header class="header admin">
      <a href="/admin-dashboard">
        <img
          class="logo"
          src="img/jireh-melodies-logo.png"
          alt="Jireh Melodies Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="/admin-dashboard">All Users</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="/all-courses">All Courses</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="#">Account</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="section-all-users">
        <div class="container">
          <div class="heading-cta">
            <h2 class="heading-secondary">Assign Courses</h2>
          </div>
          <div class="assign form-container">
            <div class="input-box">
              <label>Select User</label>
              <select id="userDropdown" class="user-input-field"></select>
            </div>

            <div class="input-box">
              <label>Select Course</label>
              <div id="courseList" class="course-checkbox"></div>
            </div>

            <div class="buttons">
              <a
                href="/admin-dashboard"
                class="btn btn--outline cancelBtn"
                id="cancelBtn"
                >Cancel</a
              >

              <button id="assignBtn" class="btn btn--primary">
                Assign Course
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/assign-course.js"></script>
  </body>
</html>
