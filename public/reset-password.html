<!doctype html>
<html>
  <head>
    <title>Reset Password</title>

    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Jireh Melodies, we believe music is for everyone. Our goal is to break geographical, financial, and time-related barriers by offering affordable, accessible, and professional music training online."
    />

    <!-- Always include this line of code -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Jireh Melodies</title>
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/queries.css" rel="stylesheet" />
    <link href="/css/animations.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>

  <body>
    <section class="section-reset">
      <div class="reset-container">
        <h2 class="small-heading">Reset Password</h2>

        <input
          class="reset-input"
          type="password"
          id="password"
          placeholder="Enter new password"
        />
        <input
          class="reset-input"
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
        />

        <button onclick="resetPassword()" class="reset-button">
          Update Password
        </button>

        <p id="message"></p>
      </div>
    </section>

    <!-- IMPORTANT: correct path -->
    <script src="/js/reset.js"></script>
  </body>
</html>
