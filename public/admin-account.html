<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jireh Melodies</title>
    <link href="style.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>
  <body>
    <header class="header admin">
      <a href="admin-dashboard.html">
        <img
          class="logo"
          src="img/jireh-melodies-logo.png"
          alt="Jireh Melodies Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list-item active">
            <a class="main-nav-link" href="admin-dashboard.html">All Users</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="all-courses.html">All Courses</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="#">Account</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section-add-user">
        <div class="container">
          <div class="heading-cta">
            <h2 class="heading-secondary">My Account</h2>
          </div>

          <div class="add-user-form grid grid--2-cols">
            <div class="form-container">
              <div class="input-box">
                <label>Full Name</label>
                <input id="fullname" class="user-input-field" disabled />
              </div>

              <div class="input-box">
                <label>Phone</label>
                <input id="phone" class="user-input-field" disabled />
              </div>

              <div class="input-box">
                <label>Email</label>
                <input id="email" class="user-input-field" disabled />
              </div>

              <div class="buttons">
                <button id="logoutBtn" class="btn btn--primary">Logout</button>
              </div>
            </div>

            <div class="login-cred">
              <h3 class="cred-heading">Login Credentials</h3>
              <div class="cred-content">
                <div class="input-box">
                  <label>Username</label>
                  <input id="username" class="input-field" readonly />
                </div>

                <div class="input-box">
                  <label>Password</label>
                  <input id="password" class="input-field" readonly />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/user-account.js"></script>
  </body>
</html>
