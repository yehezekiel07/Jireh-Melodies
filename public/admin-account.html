<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Jireh Melodies, we believe music is for everyone. Our goal is to break geographical, financial, and time-related barriers by offering affordable, accessible, and professional music training online."
    />

    <!-- Always include this line of code -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Jireh Melodies</title>
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/queries.css" rel="stylesheet" />
    <link href="css/animations.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>
  <body>
    <header class="header admin">
      <a href="/admin-dashboard">
        <img
          class="logo"
          src="img/jireh-melodies-logo.png"
          alt="Jireh Melodies Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="/admin-dashboard">All Users</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="/all-courses">All Courses</a>
          </li>
          <li class="main-nav-list-item active">
            <a class="main-nav-link" href="#">Account</a>
          </li>
        </ul>
      </nav>
      <button class="btn-mobile-nav">
        <i class="ph ph-list link-icon icon-mobile-nav" name="menu-outline"></i>
        <i class="ph ph-x link-icon icon-mobile-nav" name="close-outline"></i>
      </button>
    </header>

    <main>
      <section class="section-all-users">
        <div class="container">
          <div class="heading-cta reveal">
            <h2 class="heading-secondary">My Account</h2>
          </div>

          <div class="add-user-form grid grid--2-cols">
            <div class="form-container form-account">
              <div class="input-box reveal-right">
                <label>Full Name</label>
                <input id="fullname" class="user-input-field" disabled />
              </div>

              <div class="input-box reveal-right">
                <label>Phone</label>
                <input id="phone" class="user-input-field" disabled />
              </div>

              <div class="input-box reveal-right">
                <label>Email</label>
                <input id="email" class="user-input-field" disabled />
              </div>
            </div>

            <div class="login-cred">
              <h3 class="cred-heading">Login Credentials</h3>
              <div class="cred-content">
                <div class="input-box reveal-right">
                  <label>Username</label>
                  <input id="username" class="input-field" readonly />
                </div>

                <div class="input-box reveal-right">
                  <label>Password</label>
                  <input id="password" class="input-field" readonly />
                </div>
              </div>
            </div>
          </div>
          <div class="buttons-left">
            <button id="logoutBtn" class="btn btn--primary">Logout</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/user-account.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
