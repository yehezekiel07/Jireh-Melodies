<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jireh Melodies</title>
    <link href="style.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="user-dashboard.html">
        <img
          class="logo"
          src="img/jireh-melodies-logo.png"
          alt="Jireh Melodies Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="user-dashboard.html">My Learning</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="user-all-courses.html"
              >All Courses</a
            >
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="user-account.html">My Account</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="section-contact-us">
        <div class="normal-container">
          <div class="course-player">
            <!-- RIGHT: Player -->
            <div class="player">
              <iframe
                id="videoPlayer"
                class="video-player"
                width="100%"
                height="600"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                "
                allowfullscreen
              >
              </iframe>
            </div>
            <!-- LEFT: Modules -->
            <div class="sidebar" id="moduleList"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/course-player.js"></script>
  </body>
</html>
