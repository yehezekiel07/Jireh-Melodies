<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Jireh Melodies, we believe music is for everyone. Our goal is to break geographical, financial, and time-related barriers by offering affordable, accessible, and professional music training online."
    />

    <!-- Always include this line of code -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Jireh Melodies</title>
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/queries.css" rel="stylesheet" />
    <link href="css/animations.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="/admin-dashboard">
        <img
          class="logo"
          src="img/jireh-melodies-logo.png"
          alt="Jireh Melodies Logo"
        />
      </a>
      <nav class="main-nav">
        <ul class="main-nav-list">
          <li class="main-nav-list-item active">
            <a class="main-nav-link" href="#">All Users</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="#">All Courses</a>
          </li>
          <li class="main-nav-list-item">
            <a class="main-nav-link" href="#">Account</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="section-add-user">
        <div class="container">
          <div class="heading-cta add-users reveal">
            <h2 class="heading-secondary">User Details</h2>
          </div>
          <div class="add-user-form grid grid--2-cols">
            <form
              class="form-container form-account"
              name="log-in"
              id="loginForm"
            >
              <div class="input-box reveal-right">
                <label for="full-name">Full Name</label>
                <input
                  class="user-input-field"
                  id="fullname"
                  type="text"
                  disabled
                />
              </div>

              <div class="input-box reveal-right">
                <label for="phone-number">Phone Number</label>
                <input
                  class="user-input-field"
                  id="phone"
                  type="text"
                  disabled
                />
              </div>

              <div class="input-box reveal-right">
                <label for="email">Email Address</label>
                <input
                  class="user-input-field"
                  id="email"
                  type="text"
                  disabled
                />
              </div>

              <div class="input-box reveal-right">
                <label for="assignedCourses">Assigned Courses</label>
                <div
                  id="assignedCourses"
                  class="user-input-field assigned-courses"
                ></div>
              </div>

              <div class="buttons reveal">
                <a
                  href="/admin-dashboard"
                  class="btn btn--outline cancelBtn"
                  id="cancelBtn"
                  >Back</a
                >
                <a href="#" class="btn btn--full deleteUser" id="deleteUser"
                  >Delete User</a
                >
              </div>
            </form>
            <div
              class="login-cred"
              id="credentialsSection"
              style="display: flex"
            >
              <h3 class="cred-heading">Login Credentials</h3>
              <div class="cred-content">
                <div class="input-box reveal-right">
                  <label for="username">Username</label>
                  <input
                    type="text"
                    class="input-field"
                    id="username"
                    readonly
                  />
                </div>
                <div class="input-box reveal-right">
                  <label for="password">Password</label>
                  <input
                    type="text"
                    class="input-field"
                    id="password"
                    readonly
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="js/view-user.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
